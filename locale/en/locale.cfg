[mod-setting-description]
fmf-enabled=Master switch for the mod's runtime behaviour.
fmf-disable-friendly-fire=Turn off friendly fire on your force so hunters don't damage themselves, each other, or your base. Affects your whole force. (Lowering Nuclear resistance below 1.0 can still let nukes hurt non-immune units.)
fmf-light-guns=How many guns a Light Hunter deploys with (1-4).
fmf-medium-guns=How many guns a Medium Hunter deploys with (1-4).
fmf-heavy-guns=How many rocket launchers a Heavy Hunter deploys with (1-4). More = bigger volley but more wasted overkill.
fmf-cannon-guns=How many cannons a Cannon Hunter deploys with (1-4).
fmf-siege-guns=How many cannons a Siege Hunter deploys with (1-4).
fmf-nuclear-guns=How many rocket launchers a Nuclear Hunter deploys with (1-4). 1 avoids dumping a multi-nuke barrage.
fmf-light-resistance=Multiplier on the Light Hunter's damage resistances (1.0 = default; it has none by default).
fmf-medium-resistance=Multiplier on the Medium Hunter's damage resistances (1.0 = default).
fmf-heavy-resistance=Multiplier on the Heavy Hunter's damage resistances (1.0 = default).
fmf-cannon-resistance=Multiplier on the Cannon Hunter's damage resistances (1.0 = default).
fmf-siege-resistance=Multiplier on the Siege Hunter's damage resistances (1.0 = default).
fmf-nuclear-resistance=Multiplier on the Nuclear Hunter's damage resistances (1.0 = default; 1.0 keeps full nuke immunity).

